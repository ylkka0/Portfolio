name: Portfolio build

on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'index.html'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/portfolio-build.yml'
  push:
    branches:
      - feature/portfolio-website-v1
    paths:
      - 'src/**'
      - 'package.json'
      - 'index.html'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/portfolio-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build website
        run: npm run build
